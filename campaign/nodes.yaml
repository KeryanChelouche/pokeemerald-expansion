# Campaign table (spec §7), generated by tools/gen_nodes.py.
# DO NOT EDIT BY HAND -- edit ORDER in tools/campaign_route.py and rerun.
#
# The run ends when Norman falls (segment 16). Fights form one linear chain,
# so there is exactly one next fight at any moment. Locations are gated only
# by fights, and every draw carries the capability it needs -- so a location
# left unspent keeps offering better draws as rods and Surf arrive, which is
# R2's delay decision made real.

